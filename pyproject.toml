[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lokyymail"
version = "0.3.0"
description = "LokyyMail: Mail-Gateway mit menschlicher Freigabe für KI-Agenten (Hermes, Claude, n8n)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oliver" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "segno>=1.6",
  "cryptography>=43",
  "nh3>=0.2.17",
  "mcp>=2.3,<3",
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "requests>=2.32",
  "pypdf>=4.3",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lokyymail = "lokyymail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lokyymail = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
